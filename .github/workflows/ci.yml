name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest bandit
      - name: Byte-compile source files
        run: |
          python -m compileall -q main.py waf_payloads.py utils.py report.py console.py src/
      - name: Security Scan (Bandit SAST)
        run: |
          bandit -r src/ main.py waf_payloads.py utils.py report.py console.py -ll
      - name: Run automated test suite
        run: |
          python -m unittest discover -s tests -v
      - name: Test CLI Dry Run
        run: |
          python main.py -u https://example.com/ -w words.txt --dry-run
          shadowrecon -u https://example.com/ -w words.txt --dry-run
